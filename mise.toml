[env]
_.path = [".venv/bin"]

[tasks.sync]
run = "uv sync"
description = "Install the editable development environment"

[tasks.check]
run = "uv run gtw --help"
description = "Verify the local CLI"

[tasks.build]
run = "uv build"
description = "Build source and wheel distributions"

[tasks.release]
run = "uv run verkit release patch"
description = "Create and push the next patch release"
